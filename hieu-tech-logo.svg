<svg width="420" height="150" viewBox="-15 25 420 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="100%;70%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8f6ff"/>
      <stop offset="100%" stop-color="#8fd9ff"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pulse {
        animation: pulseGlow 2.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      .spin-slow {
        animation: spin 14s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .node {
        animation: blink 3s ease-in-out infinite;
      }
      .node.d2 { animation-delay: .6s; }
      .node.d3 { animation-delay: 1.2s; }
      .node.d4 { animation-delay: 1.8s; }
      @keyframes blink {
        0%, 100% { opacity: .35; }
        50%      { opacity: 1; }
      }
    </style>
  </defs>

  <!-- nền trong suốt, phù hợp cả nền sáng và tối -->

  <!-- Icon: khối lục giác công nghệ + đường mạch (circuit) quanh chữ H -->
  <g transform="translate(45,100)">
    <!-- vòng hào quang phía sau -->
    <polygon class="pulse" points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27"
             fill="none" stroke="url(#iconGrad)" stroke-width="3" filter="url(#glow)"/>

    <!-- lục giác chính -->
    <polygon class="spin-slow" points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23"
             fill="none" stroke="url(#iconGrad)" stroke-width="4" stroke-linejoin="round"/>

    <!-- chữ H cách điệu bên trong -->
    <g stroke="url(#iconGrad)" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="-16" y1="-22" x2="-16" y2="22"/>
      <line x1="16" y1="-22" x2="16" y2="22"/>
      <line x1="-16" y1="0" x2="16" y2="0"/>
    </g>

    <!-- các nút mạch nhỏ nhấp nháy -->
    <circle class="node" cx="0" cy="-46" r="4" fill="#00e5ff"/>
    <circle class="node d2" cx="40" cy="-23" r="4" fill="#2979ff"/>
    <circle class="node d3" cx="40" cy="23" r="4" fill="#7c4dff"/>
    <circle class="node d4" cx="0" cy="46" r="4" fill="#00e5ff"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="start">
    <text x="120" y="95" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="1">
      Hieu
    </text>
    <text x="243" y="95" font-size="52" font-weight="300" fill="#00e5ff" letter-spacing="2">
      Tech
    </text>
    <text x="121" y="122" font-size="14" font-weight="500" fill="#7fb8d9" letter-spacing="4">
      B U I L D &#160; S M A R T &#160; T H I N G S
    </text>
  </g>
</svg>
